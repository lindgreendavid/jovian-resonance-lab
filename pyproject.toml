[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jovian-resonance-lab"
version = "0.1.0"
description = "A reproducible model-ablation study of the Galilean-moon Laplace angle"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "David Lindgreen" }]
keywords = ["planetary-science", "celestial-mechanics", "jupiter", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = []

[project.optional-dependencies]
analysis = []
dev = [
  "build>=1.2",
  "hatchling>=1.27",
  "mypy>=1.13,<3",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://lindgreendavid.github.io/jovian-resonance-lab/"
Repository = "https://github.com/lindgreendavid/jovian-resonance-lab"
Documentation = "https://github.com/lindgreendavid/jovian-resonance-lab/blob/main/docs/protocol-v0.1.md"

[project.scripts]
jovian-resonance = "jovian_resonance_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jovian_resonance_lab"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=jovian_resonance_lab --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["jovian_resonance_lab"]
